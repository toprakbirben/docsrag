[project]
name = "docsrag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "typer>=0.12",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
docsrag = "docsrag.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
